<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Savewave</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#e03d27">
  <link rel="icon" type="image/png" href="/savewave-light.png">
  <link rel="apple-touch-icon" href="/pwa-icon-dark.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="dist.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#e03d27] text-white min-h-screen relative overflow-x-hidden antialiased flex flex-col justify-between">
  
  <div class="rig-scanlines-bg"></div>

  <!-- Header -->
  <header class="relative z-20 border-b border-black/20 px-6 md:px-12 py-5 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3 hover:opacity-90 transition-opacity">
      <img src="savewave-dark.png" class="w-9 h-9 squircle-logo" alt="Savewave Logo" />
      <span class="font-bold tracking-tighter text-xl text-black">SAVEWAVE</span>
    </a>
    <a href="/" class="btn-chamfer font-mono text-xs uppercase tracking-wider font-bold py-3 px-6 bg-[#0d0d0e] text-white hover:bg-[#1a1a1d] border border-black/20 transition-all flex items-center gap-2">
      RETURN HOME
    </a>
  </header>

  <!-- Main 404 Brutalist Display -->
  <main class="relative z-10 max-w-4xl mx-auto px-6 py-16 w-full text-center flex-1 flex flex-col items-center justify-center">
    
    <div class="paper-dark-texture border-2 border-white/20 p-8 md:p-12 shadow-2xl btn-chamfer w-full max-w-2xl text-left relative overflow-hidden">
      
      <div class="flex items-center justify-between mb-8 border-b border-white/10 pb-4">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 bg-[#e03d27] rounded-full animate-pulse"></span>
          <span class="font-mono text-xs uppercase tracking-widest text-[#e03d27] font-bold">ERROR STATUS 404</span>
        </div>
        <span class="font-mono text-[10px] text-zinc-500 uppercase tracking-widest">SIGNAL LOST</span>
      </div>

      <h1 class="font-mono text-6xl md:text-8xl font-black text-white tracking-tighter mb-4">
        404
      </h1>

      <p class="font-mono text-base md:text-lg text-zinc-300 font-bold mb-4 uppercase tracking-wide">
        RESOURCE UNRESOLVED / ROUTE NON-EXISTENT
      </p>

      <p class="font-mono text-xs text-zinc-400 leading-relaxed mb-8">
        The specified URL target could not be located on the Savewave stateless engine. The page may have been moved, renamed, or deleted.
      </p>

      <div class="flex flex-wrap gap-4 pt-4 border-t border-white/10">
        <a href="/" class="btn-chamfer font-mono text-xs uppercase tracking-wider font-bold py-4 px-8 bg-[#e03d27] text-white hover:bg-[#b82a17] border border-white/20 transition-all flex items-center gap-2">
          OPEN SAVEWAVE DOWNLOADER
        </a>
        <a href="https://github.com/kuberbassi/savewave#privacy-model" class="btn-chamfer font-mono text-xs uppercase tracking-wider font-bold py-4 px-8 bg-transparent text-white border border-white/30 hover:bg-white/10 transition-all">
          PRIVACY NOTES
        </a>
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="relative z-10 bg-[#08080a] border-t border-white/10 px-6 md:px-12 py-8">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 font-mono text-xs text-zinc-400">
      <div class="flex items-center gap-3">
        <img src="savewave-dark.png" class="w-6 h-6 squircle-logo" alt="Savewave Logo" />
        <span class="font-bold text-white tracking-widest text-sm">SAVEWAVE</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
        <span>© 2026 SAVEWAVE</span>
      </div>
    </div>
  </footer>

</body>
</html>
