[package]
name = "savewave-desktop"
version = "2.0.0"
description = "Savewave privacy-focused local media saver"
authors = ["Kuber Bassi"]
edition = "2021"

[lib]
name = "savewave_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
savewave-core = { path = "../crates/savewave-core" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
dirs = "5"
url = "2"
reqwest = { workspace = true }
