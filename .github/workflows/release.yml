name: Windows Release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ('v' + $version -ne '${{ github.ref_name }}') { throw 'Tag and package version differ.' }
      - run: npm run check
      - run: npm run electron:pack -- --publish never
      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'dist/Savewave_*_x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: savewave-windows
          path: |
            dist/Savewave_*_x64-setup.exe
            dist/Savewave_*_x64-setup.exe.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/Savewave_*_x64-setup.exe
            dist/Savewave_*_x64-setup.exe.sha256
